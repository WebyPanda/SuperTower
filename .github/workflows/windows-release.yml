name: Build Windows release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build executable
        shell: pwsh
        run: .\packaging\build_windows.ps1 -PythonPath (Get-Command python).Source
      - uses: actions/upload-artifact@v4
        with:
          name: SuperTower-Windows
          path: SuperTower.exe
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$env:GITHUB_REF_NAME" "SuperTower.exe" --generate-notes
